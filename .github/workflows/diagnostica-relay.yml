name: Diagnostica relay MIT
on:
  push:
    paths: [".github/workflows/diagnostica-relay.yml"]
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Prova relay autenticato
        run: |
          PYTHONPATH=tools python - <<'PY'
          from mit_relay import scarica_relay
          for path, limit in [('rss', 2_000_000), ('annual', 12_000_000)]:
              content = scarica_relay(path, limit)
              print(path, 'ricevuto:', len(content), 'byte')
          PY
