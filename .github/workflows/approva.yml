name: Approva proposta

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: aggiorna-mappa
  cancel-in-progress: false

jobs:
  approva:
    # Solo l'etichetta "approva" su una proposta creata dall'automazione o dal proprietario del repo
    if: >-
      github.event.label.name == 'approva' &&
      contains(github.event.issue.labels.*.name, 'proposta') &&
      (github.event.issue.user.login == 'github-actions[bot]' || github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MSG_FILE: ${{ runner.temp }}/msg.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aggiungi l'evento
        id: approva
        continue-on-error: true
        run: python tools/approva.py

      - name: Ricostruisci e pubblica
        if: steps.approva.outcome == 'success'
        run: |
          python tools/build_page.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data index.html
          git commit -m "Approvata proposta #${{ github.event.issue.number }}"
          git pull --rebase
          git push
          gh issue comment ${{ github.event.issue.number }} --body-file "$MSG_FILE"
          gh issue close ${{ github.event.issue.number }} --reason completed

      - name: Spiega perché non è stata approvata
        if: steps.approva.outcome == 'failure'
        run: |
          gh issue comment ${{ github.event.issue.number }} --body-file "$MSG_FILE"
          gh issue edit ${{ github.event.issue.number }} --remove-label approva
