name: Sincronizza archivio 2026
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/eventi.json", "data/eventi-verificati.json", "data/province.json", "tools/**", ".github/workflows/aggiorna.yml", ".github/workflows/pubblica.yml"]
permissions:
  contents: write
  pages: write
  id-token: write
defaults:
  run:
    shell: bash
concurrency:
  group: archivio-mappa
  cancel-in-progress: false
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Controlli e test
        run: |
          python tools/valida.py
          python -m unittest discover -s tools -p 'test_*.py'
      - name: Recupera tutto il 2026 dal MIT
        run: |
          set +e
          python tools/mit_scioperi.py | tee -a "$GITHUB_STEP_SUMMARY"
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -eq 75 ]; then
            python -c 'import json; d=json.load(open("data/scioperi-mit.json",encoding="utf-8")); assert d.get("anno")==2026 and d.get("sincronizzato") and d.get("eventi"), "Archivio MIT precedente assente o non valido"'
            echo '::warning::MIT temporaneamente non disponibile: pubblico la pagina con l’ultimo archivio MIT valido. La data di sincronizzazione resta invariata.'
            echo 'MIT temporaneamente non disponibile: usato l’ultimo archivio valido; la data di sincronizzazione non è stata aggiornata.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$result" -ne 0 ]; then
            exit "$result"
          fi
      - name: Integra feed RSS MIT
        run: python tools/mit_scioperi.py --rss | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Ricostruisci e verifica l'archivio
        run: |
          python tools/build_page.py | tee -a "$GITHUB_STEP_SUMMARY"
          python tools/valida.py --archivio
      - name: Salva i dati e la pagina
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data index.html
          if ! git diff --cached --quiet; then
            git commit -m "Sincronizza archivio MIT 2026 e pagina"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
  pubblica:
    needs: aggiorna
    uses: ./.github/workflows/pubblica.yml
  controlla_freschezza:
    needs: [aggiorna, pubblica]
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Segnala se MIT e RSS non si aggiornano da oltre 36 ore
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import sys

          with open('data/aggiornamento.json', encoding='utf-8') as source:
              update = json.load(source)
          now = dt.datetime.now(dt.timezone.utc)
          ages = {}
          for label, key in [('tabella MIT', 'syncedAt'), ('RSS MIT', 'rssCheckedAt')]:
              timestamp = dt.datetime.fromisoformat(update[key].replace('Z', '+00:00'))
              if timestamp.tzinfo is None or timestamp > now:
                  raise ValueError(f'Data non valida per {label}: {update[key]}')
              ages[label] = now - timestamp
              print(f'{label}: ultima acquisizione {update[key]}, {ages[label]} fa')
          limit = dt.timedelta(hours=36)
          if all(age > limit for age in ages.values()):
              print('::error::Nessuna acquisizione MIT o RSS riuscita da oltre 36 ore; la pagina usa dati conservati.')
              sys.exit(1)
          for label, age in ages.items():
              if age > limit:
                  print(f'::warning::{label} non aggiornato da oltre 36 ore.')
          PY



