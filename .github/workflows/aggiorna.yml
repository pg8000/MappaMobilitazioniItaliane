name: Aggiorna dati e pagina

on:
  schedule:
    - cron: "30 5 * * *"        # ogni giorno, circa le 7:30 in Italia
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/eventi.json"
      - "data/province.json"
      - "tools/sorgente-artifact.html"
      - "tools/build_*.py"

permissions:
  contents: write
  issues: write

concurrency:
  group: aggiorna-mappa
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Valida gli eventi manuali
        run: python tools/valida.py

      - name: Scioperi dal calendario MIT
        id: mit
        if: github.event_name != 'push'
        continue-on-error: true
        run: python tools/mit_scioperi.py

      - name: Ricostruisci la pagina
        run: python tools/build_page.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Etichette per le proposte
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create proposta --color FBCA04 --description "Manifestazione proposta dall'automazione" --force
          gh label create approva  --color 0E8A16 --description "Aggiungi la proposta alla mappa" --force

      - name: Proposte di manifestazioni
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/proposte.py

      - name: Pubblica le modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data index.html
          if git diff --cached --quiet; then
            echo "Nessuna modifica."
          else
            git commit -m "Aggiornamento automatico dei dati"
            git pull --rebase
            git push
          fi

      - name: Segnala se il calendario MIT non si legge più
        if: steps.mit.outcome == 'failure'
        run: |
          echo "::error::Il calendario MIT non è stato letto: controlla tools/mit_scioperi.py (la pagina potrebbe essere cambiata). Gli scioperi restano quelli dell'ultimo aggiornamento."
          exit 1
