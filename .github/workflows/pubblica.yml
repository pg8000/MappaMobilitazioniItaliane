name: Pubblica la mappa
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index.html"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pubblicazione-mappa
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Prepara solo i file pubblici
        run: |
          mkdir -p _site/data
          cp index.html _site/
          for name in archivio aggiornamento province eventi scioperi-mit eventi-verificati; do
            if [ -f "data/$name.json" ]; then cp "data/$name.json" _site/data/; fi
          done
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
